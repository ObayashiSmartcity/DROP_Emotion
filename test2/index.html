<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"> 
<title>DROPs Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="config.js"></script>
</head>
<body>
<canvas id="chart"></canvas>

<script>
fetch('./drop_wb20.json')
  .then(res => res.json())
  .then(data => {
    const unique = Object.values(
      data.reduce((acc, item) => {
        const key = item.artwork_id + '_' + item.rank;
        acc[key] = item;
        return acc;
      }, {})
    );

    const counts = {};
    unique.forEach(d => {
      counts[d.category] = (counts[d.category] || 0) + 1;
    });

    const labels = Object.keys(counts);
    const values = Object.values(counts);

    new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{ label: 'カテゴリ件数', data: values }]
      }
    });
  });
</script>
</body>
</html>
