<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>DROPS Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="./config.js"></script>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
}
canvas {
  max-width: 800px;
}
</style>
</head>

<body>

<h1>DROPS分析</h1>
<p id="status">読み込み中...</p>
<canvas id="chart"></canvas>

<script>
(() => {

const state = {
  raw: []
};

const $ = id => document.getElementById(id);

// ✅ NaN安全変換
const safeNumber = v => (isNaN(Number(v)) ? 0 : Number(v));

async function loadData() {
  try {
    const res = await fetch('./drop_wb20.json');

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    // 🔥 重要：text取得 → NaN除去
    const text = await res.text();

    const sanitized = text.replace(/\bNaN\b/g, 'null');

    let json;
    try {
      json = JSON.parse(sanitized);
    } catch (e) {
      throw new Error('JSONパース失敗（NaNまたは破損）');
    }

    if (!Array.isArray(json)) throw new Error('配列形式ではない');

    state.raw = json;

    $('status').textContent = `✅ ${json.length} レコード`;

    render();

  } catch (e) {
    console.error(e);
    $('status').textContent = '❌ ' + e.message;
  }
}

function render() {

  const top1 = state.raw.filter(d => d.rank === 'top1');

  const categoryMap = {};

  top1.forEach(d => {
    if (!d.category) return;

    if (!categoryMap[d.category]) {
      categoryMap[d.category] = {
        count: 0,
        total: 0
      };
    }

    const score = safeNumber(d.score);

    categoryMap[d.category].count++;
    categoryMap[d.category].total += score;
  });

  const labels = Object.keys(categoryMap);

  const data = labels.map(c => categoryMap[c].count);

  const ctx = $('chart').getContext('2d');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '投稿数',
        data,
        backgroundColor: labels.map((_, i) => 
          window.COLOR_CONFIG.light.wb[i % 10]
        )
      }]
    }
  });
}

loadData();

})();
</script>

</body>
</html>
